name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A pushed fix should not queue behind the run it fixes.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------- #
  # The install check and the pytest suite, across the supported Pythons.
  #
  # No Discord token and no network access to YouTube is needed: the suite is
  # built to run against fakes, and `--check` only inspects the machine.
  # --------------------------------------------------------------------- #
  tests:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ${{ matrix.runs-on }}
    # Bound the job, and not only the steps: the failure that motivated this is
    # a stalled apt mirror, which produces a job that sits there producing
    # nothing for as long as GitHub allows (six hours by default) and looks
    # exactly like a dead runner from the outside. Nothing in this job has any
    # business taking 25 minutes.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # The declared minimum. Pinned to 22.04 because the 3.9 build is not
          # published for every ubuntu-latest image.
          - python: "3.9"
            runs-on: ubuntu-22.04
          - python: "3.11"
            runs-on: ubuntu-latest
          # 3.13 removed audioop; discord.py>=2.4 pulls in audioop-lts for it,
          # so this entry is also a check that the pin stays correct.
          - python: "3.13"
            runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Voice needs an ffmpeg binary and libopus as a shared library; neither is
      # a Python package, and both are what `--check` exists to verify.
      #
      # Bounded twice over, because an unbounded `apt-get update` is what turned
      # a stalled mirror into a job that produced nothing for half an hour with
      # no explanation anywhere: each attempt is killed after 240s and the loop
      # gives up after three. A mirror that is only briefly unreachable no
      # longer fails the build, and one that is genuinely gone costs minutes
      # instead of the job. ForceIPv4 plus the Acquire timeouts stop an
      # individual connection (the classic culprit is a blackholed IPv6 route to
      # archive.ubuntu.com while IPv4 works) from hanging in the first place.
      #
      # Verified against the runner that actually stalled: on this branch's
      # first run after these flags went in, the Python 3.9 job's mirror stalled
      # again and the step failed on its 10-minute timeout instead of hanging -
      # bounded, but still red. Hence the retries.
      - name: Install system audio dependencies
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          updated=0
          for attempt in 1 2 3; do
            if sudo timeout 240 apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=2 \
                 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update; then
              updated=1
              break
            fi
            echo "::warning::apt-get update attempt $attempt/3 did not finish in 240s"
            sleep 10
          done
          if [ "$updated" != "1" ]; then
            echo "::error::apt-get update did not complete in 3 attempts - the mirror is unreachable from this runner"
            exit 1
          fi
          sudo apt-get install -y --no-install-recommends ffmpeg libopus0
          ffmpeg -version | head -1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # A smoke test of the machine, not of Discord: ffmpeg and opus discovery,
      # the resolved data directory, the config candidate order. LOFI_TOKEN is a
      # dummy so the token row is satisfied; nothing here connects anywhere.
      - name: Install check
        env:
          LOFI_TOKEN: ci-dummy-token-not-used-for-anything
          LOFI_HOME: ${{ runner.temp }}/lofi-check
        run: python bot.py --check

      - name: pytest
        env:
          LOFI_HOME: ${{ runner.temp }}/lofi-pytest
          LOFI_TOKEN: ci-dummy-token-not-used-for-anything
        run: |
          # pipefail so the tee cannot hide pytest's exit code.
          set -o pipefail
          python -m pytest -ra 2>&1 | tee pytest.log

      # Which test failed has to be readable without downloading the log - one
      # runner's log is not always reachable, and "Process completed with exit
      # code 1" says nothing. Annotations ride with the check run, so they are
      # visible in the UI summary and through the checks API. Same trick the
      # release workflow uses for its build logs.
      - name: Report test failures as annotations
        if: failure()
        run: |
          [ -f pytest.log ] || exit 0
          echo "::group::pytest output (last 120 lines)"
          tail -n 120 pytest.log
          echo "::endgroup::"
          grep -E "^(FAILED|ERROR)" pytest.log | cut -c1-240 | sed 's/^/::error::/' || true
          grep -m 3 -E "^(E  +|[A-Za-z_.]+Error|assert )" pytest.log | cut -c1-240 | sed 's/^/::error::/' || true

      - name: Packaging smoke (spec + 6-way matrix names)
        run: |
          test -f lofi.spec || (echo "lofi.spec missing" && exit 1)
          python scripts/build.py --all
          python scripts/build.py --name-only
          echo "Matrix OK — see docs/PACKAGING.md for the 6 artifacts"

  # --------------------------------------------------------------------- #
  # The dashboard UI, driven in jsdom against a real server in --demo mode.
  #
  # This is the only place the shipped dashboard.html is executed, and it is
  # the check that catches markup which stops rendering something the API
  # still sends.
  # --------------------------------------------------------------------- #
  ui:
    name: dashboard UI (jsdom)
    runs-on: ubuntu-latest
    # This is the job that hung on PR #7: half an hour inside `apt-get update`,
    # no output, and the run kept its checks pending the whole time. A job
    # timeout turns that into a failure someone can act on.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install system audio dependencies
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Same hardening as the tests job: see the note there.
          updated=0
          for attempt in 1 2 3; do
            if sudo timeout 240 apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=2 \
                 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update; then
              updated=1
              break
            fi
            echo "::warning::apt-get update attempt $attempt/3 did not finish in 240s"
            sleep 10
          done
          if [ "$updated" != "1" ]; then
            echo "::error::apt-get update did not complete in 3 attempts - the mirror is unreachable from this runner"
            exit 1
          fi
          sudo apt-get install -y --no-install-recommends ffmpeg libopus0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install jsdom
        working-directory: tests/ui
        timeout-minutes: 10
        run: npm install --no-audit --no-fund

      # Demo mode needs no bot token and writes to a throwaway database, so
      # nothing in this job touches a real Discord account or real history.
      # The key is fixed and public: it protects a simulated server in a CI
      # runner that is destroyed at the end of the job.
      - name: Start the demo dashboard
        env:
          LOFI_HOME: ${{ runner.temp }}/lofi-ui
          LOFI_DASHBOARD_TOKEN: ci-ui-key-0123456789abcdefghijklmnopqrstuvwxyz
        run: |
          nohup python bot.py --demo --dashboard-host 127.0.0.1 --dashboard-port 8790 \
            > "$RUNNER_TEMP/demo.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/demo.pid"
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8790/healthz > /dev/null; then
              echo "demo dashboard is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "demo dashboard did not start; log follows"
          cat "$RUNNER_TEMP/demo.log"
          exit 1

      - name: Drive the UI
        env:
          LOFI_DASHBOARD_TOKEN: ci-ui-key-0123456789abcdefghijklmnopqrstuvwxyz
        run: node tests/ui/dashboard.ui.js "$LOFI_DASHBOARD_TOKEN"

      - name: Stop the demo dashboard
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/demo.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/demo.pid")" 2>/dev/null || true
          fi

      - name: Server log
        if: always()
        run: cat "$RUNNER_TEMP/demo.log" || true
