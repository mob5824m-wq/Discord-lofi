name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (e.g. 1.0.1). Leave empty to use VERSION file."
        required: false
        default: ""

permissions:
  contents: write

# 6 artifacts: 1 arm + 1 native for each OS — debian (Linux), macOS, Windows.
#
# PyInstaller is NOT a cross-compiler, so each arch is built on its native runner.
# GitHub-hosted runners used:
#   linux-amd64   → ubuntu-22.04
#   linux-arm64   → ubuntu-24.04-arm
#   macos-amd64   → macos-13        (Intel, last Intel image)
#   macos-arm64   → macos-14        (Apple Silicon)
#   windows-amd64 → windows-2022
#   windows-arm64 → windows-11-arm
#
# If a runner image is retired, replace it with the nearest equivalent
# (e.g. macos-13 → macos-13-large, windows-11-arm → windows-2022 + emulation note).
# The artifact names stay stable: lofi-<version>-<os>-<arch>[.exe]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # --------------------------------------------------------------------- #
  # Build the 6 native binaries
  # --------------------------------------------------------------------- #
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            py: "3.11"
            target_os: linux
            arch: amd64
            artifact: lofi-linux-amd64
            archive: lofi-linux-amd64.tar.gz
            runner_note: debian amd64

          - os: ubuntu-24.04-arm
            py: "3.11"
            target_os: linux
            arch: arm64
            artifact: lofi-linux-arm64
            archive: lofi-linux-arm64.tar.gz
            runner_note: debian arm64

          - os: macos-13
            py: "3.11"
            target_os: macos
            arch: amd64
            artifact: lofi-macos-amd64
            archive: lofi-macos-amd64.tar.gz
            runner_note: mac intel

          - os: macos-14
            py: "3.11"
            target_os: macos
            arch: arm64
            artifact: lofi-macos-arm64
            archive: lofi-macos-arm64.tar.gz
            runner_note: mac apple silicon

          - os: windows-2022
            py: "3.11"
            target_os: windows
            arch: amd64
            artifact: lofi-windows-amd64.exe
            archive: lofi-windows-amd64.zip
            runner_note: windows amd64

          - os: windows-11-arm
            py: "3.11"
            target_os: windows
            arch: arm64
            artifact: lofi-windows-arm64.exe
            archive: lofi-windows-arm64.zip
            runner_note: windows arm64

    name: build ${{ matrix.target_os }}-${{ matrix.arch }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
          cache: pip

      # System audio deps: only needed for --check smoke test inside the built binary,
      # but cheap to install here and proves the matrix is viable.
      - name: Install system audio dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libopus0
          ffmpeg -version | head -1
          ldconfig -p | grep opus || true

      - name: Install system audio dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install ffmpeg opus || brew upgrade ffmpeg opus || true
          ffmpeg -version | head -1

      - name: Install system audio dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress || winget install -e --id Gyan.FFmpeg || echo "ffmpeg install best-effort"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pyinstaller --version

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "ver=${{ inputs.version }}" | sed 's/^v//' >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "ver=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "ver=$(cat VERSION | tr -d ' \n\r')" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      # Build with PyInstaller spec; then rename to versioned arch-specific names.
      - name: Build binary (PyInstaller)
        shell: bash
        run: |
          echo "Building for ${{ matrix.target_os }}/${{ matrix.arch }} on ${{ matrix.os }}"
          python -m PyInstaller lofi.spec --noconfirm --log-level WARN
          ls -lh dist/

      - name: Rename + archive artifact
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.ver }}"
          OS="${{ matrix.target_os }}"
          ARCH="${{ matrix.arch }}"
          ARTIFACT="${{ matrix.artifact }}"
          ARCHIVE="${{ matrix.archive }}"

          # PyInstaller always emits dist/lofi (or dist/lofi.exe on Windows)
          SRC="dist/lofi"
          if [ "$OS" = "windows" ]; then SRC="dist/lofi.exe"; fi
          if [ ! -f "$SRC" ]; then
            # fallback: whichever exists
            if [ -f "dist/lofi.exe" ]; then SRC="dist/lofi.exe"
            elif [ -f "dist/lofi" ]; then SRC="dist/lofi"
            else
              echo "Built binary not found:"; ls -R dist/; exit 1
            fi
          fi

          cp -v "$SRC" "dist/$ARTIFACT"
          cp -v "$SRC" "dist/lofi-${VER}-${OS}-${ARCH}${OS:+}${OS/windows/.exe}"
          # Correct the versioned name for windows .exe extension
          if [ "$OS" = "windows" ]; then
            # ensure .exe
            if [ -f "dist/lofi-${VER}-${OS}-${ARCH}" ]; then mv "dist/lofi-${VER}-${OS}-${ARCH}" "dist/lofi-${VER}-${OS}-${ARCH}.exe"; fi
          fi

          # Archive
          if [ "$OS" = "windows" ]; then
            # need zip with binary at top level + config.example.json
            cd dist
            7z a -tzip "$ARCHIVE" "$ARTIFACT" ../config.example.json ../README.md 2>/dev/null || zip -j "$ARCHIVE" "$ARTIFACT" ../config.example.json ../README.md
            cd ..
          else
            tar -czvf "dist/$ARCHIVE" -C dist "$ARTIFACT" -C .. config.example.json README.md || tar -czvf "dist/$ARCHIVE" -C dist "$ARTIFACT"
            # also provide versioned archive
            cp -v "dist/$ARCHIVE" "dist/lofi-${VER}-${OS}-${ARCH}.tar.gz"
          fi

          ls -lh dist/
          chmod +x "dist/$ARTIFACT" || true

          # Smoke-test the binary (no Discord connection; just --check and --version)
          if [ "$OS" != "windows" ]; then
            LOFI_TOKEN=ci-dummy-token LOFI_HOME="$RUNNER_TEMP/lofi-home" "dist/$ARTIFACT" --version || true
            LOFI_TOKEN=ci-dummy-token LOFI_HOME="$RUNNER_TEMP/lofi-home" "dist/$ARTIFACT" --check || echo "--check exit code $?"
          else
            # Windows: .exe invocation
            "dist/$ARTIFACT" --version || true
          fi

      - name: Upload artifact (binary)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload artifact (archive)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 30

  # --------------------------------------------------------------------- #
  # Collect the 6 artifacts into one GitHub Release when triggered by a tag
  # --------------------------------------------------------------------- #
  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          echo "ver=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          cat VERSION

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-dist
          merge-multiple: true

      - name: List artifacts
        run: |
          ls -lhR release-dist/
          echo "--- 6-way matrix check ---"
          for f in lofi-linux-amd64 lofi-linux-arm64 lofi-macos-amd64 lofi-macos-arm64 lofi-windows-amd64.exe lofi-windows-arm64.exe; do
            if [ -f "release-dist/$f" ]; then echo "✓ $f"; else echo "✗ MISSING $f" && exit 1; fi
          done
          echo "All 6 artifacts present."

      - name: Generate checksums
        run: |
          cd release-dist
          sha256sum * > SHA256SUMS.txt || shasum -a 256 * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Lofi ${{ steps.version.outputs.ver }} — 6 native artifacts

            | OS | arch | binary | archive |
            |---|---|---|---|
            | Debian/Ubuntu | amd64 | `lofi-linux-amd64` | `lofi-linux-amd64.tar.gz` |
            | Debian/Ubuntu | arm64 | `lofi-linux-arm64` | `lofi-linux-arm64.tar.gz` |
            | macOS | amd64 (Intel) | `lofi-macos-amd64` | `lofi-macos-amd64.tar.gz` |
            | macOS | arm64 (Apple Silicon) | `lofi-macos-arm64` | `lofi-macos-arm64.tar.gz` |
            | Windows | amd64 | `lofi-windows-amd64.exe` | `lofi-windows-amd64.zip` |
            | Windows | arm64 | `lofi-windows-arm64.exe` | `lofi-windows-arm64.zip` |

            Each binary is a single-file PyInstaller build — no Python needed.
            System deps still required: `ffmpeg` + `libopus` (Debian: `apt install ffmpeg libopus0`; macOS: `brew install ffmpeg opus`; Windows: `winget install Gyan.FFmpeg` — opus is bundled on Windows).
            Pass the bot token via `LOFI_TOKEN` env var or `config.json`; see `docs/INSTALL.md`.
