name: release

on:
  push:
    branches: [main]
    tags: [v*.*.*]
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (e.g. 1.0.1). Leave empty to use VERSION file."
        required: false
        default: ""
      bump:
        description: "Bump part for auto-release (patch/minor/major). Only used when run on main."
        required: false
        default: "patch"
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

# 6 artifacts: 1 arm + 1 native for each OS — debian (.deb), macOS (.dmg), Windows (.exe installer).
#
# PyInstaller is NOT a cross-compiler, so each arch is built on its native runner.
# GitHub-hosted runners used:
#   linux-amd64   → ubuntu-22.04          → .deb via dpkg-deb
#   linux-arm64   → ubuntu-24.04-arm      → .deb via dpkg-deb
#   macos-amd64   → macos-15-intel        → .dmg via hdiutil (Intel)
#   macos-arm64   → macos-14              → .dmg via hdiutil
#   windows-amd64 → windows-2022          → .exe via NSIS makensis
#   windows-arm64 → windows-11-arm        → .exe via NSIS makensis
#
# If a runner image is retired, replace it with the nearest equivalent
# (e.g. macos-15-intel → the next Intel label GitHub offers).
# The artifact names stay stable: lofi-<version>-<os>-<arch>.(deb|dmg|exe)
#
# Auto-release on merge: every push to main (i.e. each merged PR) bumps VERSION
# patch +1, commits, tags, and publishes a GitHub Release with the 6 packages.
# Tag pushes and workflow_dispatch still work as before, using the tag/input version.

# One release per ref at a time. cancel-in-progress matters more than it looks:
# a run whose job asks for a retired runner label (GitHub retired `macos-13` on
# 2025-12-04) is never picked up and sits queued, and with cancel-in-progress
# false every later release on that ref would queue behind it forever. Newer
# wins.
concurrency:
  # github.workflow_sha is deliberate. A run whose job asks for a retired
  # runner label is never picked up and sits queued until GitHub times it out
  # (up to 24h), and every later release on that ref queues behind it. Including
  # the workflow file's SHA means fixing this file - which is what you have to
  # do when a label is retired - also starts a fresh group instead of queueing
  # behind the run that can never finish.
  group: release-${{ github.ref }}-${{ github.workflow_sha }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------- #
  # Auto-bump VERSION on pushes to main (each merge → +1 patch + release)
  # Skipped on tag pushes, workflow_dispatch, and pushes by the bot itself
  # (to avoid loops from the bump commit's own push).
  # --------------------------------------------------------------------- #
  prepare:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ver: ${{ steps.bump.outputs.ver }}
      old: ${{ steps.bump.outputs.old }}
      sha: ${{ steps.push.outputs.sha }}
      bumped: ${{ steps.bump.outputs.bumped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Bump version (+1 patch)
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          PART="${{ inputs.bump }}"
          if [ -z "$PART" ]; then PART="patch"; fi
          if echo "${{ github.event.head_commit.message }}" | grep -qi "bump: *minor"; then PART="minor"; fi
          if echo "${{ github.event.head_commit.message }}" | grep -qi "bump: *major"; then PART="major"; fi
          echo "Bump part: $PART"
          OLD=$(cat VERSION | tr -d ' \n\r')
          echo "Old: $OLD"
          python scripts/bump_version.py --"$PART"
          NEW=$(cat VERSION | tr -d ' \n\r')
          echo "New: $NEW"
          echo "ver=$NEW" >> "$GITHUB_OUTPUT"
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          echo "bumped=true" >> "$GITHUB_OUTPUT"
          cat VERSION

      - name: Commit, tag and push bump
        id: push
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ steps.bump.outputs.ver }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: bump version to $VER [skip ci]"
          git push origin HEAD:main
          git tag "v$VER"
          git push origin "v$VER"
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Pushed v$VER at $SHA"

  # --------------------------------------------------------------------- #
  # Build the 6 native binaries and wrap each in its OS-native installer.
  #
  # Neither PyInstaller nor the OS packagers cross-compile, so every entry runs
  # on a runner whose CPU and OS match the artifact it produces:
  #   .deb  dpkg-deb          (Debian/Ubuntu, amd64 + arm64)
  #   .dmg  pkgbuild+hdiutil  (macOS, Intel + Apple Silicon; holds a .pkg)
  #   .exe  makensis / NSIS   (Windows, x64 + ARM64)
  #
  # The job fails rather than degrades: a zip renamed to .deb installs nothing
  # and looks identical to a real one on the release page, so
  # scripts/verify_packages.py checks the actual bytes before anything is
  # published.
  # --------------------------------------------------------------------- #
  build:
    needs: prepare
    if: always() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') && github.actor != 'github-actions[bot]'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            py: "3.11"
            target_os: linux
            arch: amd64
            artifact: lofi-linux-amd64
            runner_note: debian amd64 (.deb)

          - os: ubuntu-24.04-arm
            py: "3.11"
            target_os: linux
            arch: arm64
            artifact: lofi-linux-arm64
            runner_note: debian arm64 (.deb) — Raspberry Pi / Graviton

          - os: macos-15-intel
            py: "3.11"
            target_os: macos
            arch: amd64
            artifact: lofi-macos-amd64
            runner_note: mac intel (.dmg)

          - os: macos-14
            py: "3.11"
            target_os: macos
            arch: arm64
            artifact: lofi-macos-arm64
            runner_note: mac apple silicon (.dmg)

          - os: windows-2022
            py: "3.11"
            target_os: windows
            arch: amd64
            artifact: lofi-windows-amd64.exe
            runner_note: windows amd64 (.exe NSIS installer)

          # Windows-on-ARM gets its own requirements file (requirements-winarm.txt)
          # and Python 3.12: discord.py[voice] pins PyNaCl<1.6 and PyNaCl only
          # publishes win_arm64 wheels from 1.6.0 (and `davey` publishes none at
          # all), and numpy publishes no win_arm64 wheels for Python 3.11 at any
          # version. With those two moves every dependency installs from wheels
          # on this runner.
          - os: windows-11-arm
            py: "3.12"
            target_os: windows
            arch: arm64
            artifact: lofi-windows-arm64.exe
            runner_note: windows arm64 (.exe NSIS installer)

    name: build ${{ matrix.target_os }}-${{ matrix.arch }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # If prepare bumped, make the checked-out VERSION match, so the binary's
      # --version and the package name agree with the tag being released.
      - name: Sync bumped VERSION from prepare
        if: needs.prepare.outputs.ver != ''
        shell: bash
        run: |
          echo "Syncing VERSION to ${{ needs.prepare.outputs.ver }} (bumped by prepare)"
          echo "${{ needs.prepare.outputs.ver }}" > VERSION
          cat VERSION

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}
          cache: pip

      # ------------------------------------------------------------------ #
      # Tools each OS needs to produce a *real* installer, plus the two
      # runtime deps (ffmpeg, libopus) that stay outside the binary.
      # ------------------------------------------------------------------ #
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libopus0 dpkg-dev
          ffmpeg -version | head -1
          dpkg-deb --version | head -1
          ldconfig -p | grep -c opus || true

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          # pkgbuild and hdiutil ship with the OS; only the runtime deps come
          # from brew. Both are best-effort: a missing ffmpeg fails --check,
          # not the packaging.
          brew install ffmpeg opus || brew upgrade ffmpeg opus || true
          command -v pkgbuild || { echo "::error::pkgbuild missing"; exit 1; }
          command -v hdiutil || { echo "::error::hdiutil missing"; exit 1; }
          ffmpeg -version | head -1 || true

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsis = @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe") |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $nsis) {
            Write-Host "::error::makensis not found after 'choco install nsis'"
          } else {
            Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $nsis)
            & $nsis /VERSION
          }
          choco install ffmpeg -y --no-progress
          if ($LASTEXITCODE -ne 0) {
            Write-Host "ffmpeg install failed - the installer build does not need it (not fatal)"
          }

      # shell: bash is not decoration. The default shell on a Windows runner is
      # pwsh, and this step uses `set -o pipefail` / `tee` so the tail of a
      # failed dependency install survives into the diagnostics step.
      - name: Install Python dependencies
        shell: bash
        run: |
          set -o pipefail
          # Preflight: which platform tag pip will match wheels against, and the
          # pip that does the matching. If a dependency ever has to be built from
          # source here, this says which interpreter was doing it.
          python -c "import sys, sysconfig; print('python', sys.version.split()[0], sysconfig.get_platform())" 2>&1 | tee pip.log
          python -m pip install --upgrade pip 2>&1 | tee -a pip.log
          pip --version | tee -a pip.log
          # Windows-on-ARM installs from requirements-winarm.txt: the [voice]
          # extra in requirements.txt pins PyNaCl<1.6 and PyNaCl publishes no
          # win_arm64 wheels before 1.6.0 (and `davey` publishes none at all),
          # so that extra cannot resolve on this platform. See the header of
          # requirements-winarm.txt for the full story.
          REQ="requirements.txt"
          if [ "${{ matrix.target_os }}" = "windows" ] && [ "${{ matrix.arch }}" = "arm64" ]; then
            REQ="requirements-winarm.txt"
          fi
          echo "Requirements file: $REQ" | tee -a pip.log
          # Prefer wheels on every platform: a source build here is a build of
          # last resort (PyNaCl needs a working C toolchain), and on Windows
          # ARM64 it fails outright.
          pip install --only-binary=:all: -r "$REQ" pyinstaller 2>&1 | tee -a pip.log \
            || pip install -r "$REQ" pyinstaller 2>&1 | tee -a pip.log
          pyinstaller --version

      - name: Resolve version
        id: version
        shell: bash
        run: |
          # Priority: prepare's bump > workflow_dispatch input > tag > VERSION file
          if [ -n "${{ needs.prepare.outputs.ver }}" ]; then
            echo "ver=${{ needs.prepare.outputs.ver }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.version }}" ]; then
            echo "ver=${{ inputs.version }}" | sed 's/^v//' >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "ver=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "ver=$(cat VERSION | tr -d ' \n\r')" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

      # One PyInstaller run and one packaging run, both inside scripts/build.py:
      # running PyInstaller twice (once here, once there) doubles the build for
      # no benefit and hides which of the two actually failed.
      - name: Build binary + OS-native installer
        shell: bash
        run: |
          set -o pipefail
          echo "${{ steps.version.outputs.ver }}" > VERSION
          python scripts/build.py 2>&1 | tee build.log

      - name: Verify the artifact is the real thing
        shell: bash
        run: |
          VER="${{ steps.version.outputs.ver }}"
          OS="${{ matrix.target_os }}"
          ARCH="${{ matrix.arch }}"
          case "$OS" in
            linux)   PKG="dist/lofi-${VER}-linux-${ARCH}.deb" ;;
            macos)   PKG="dist/lofi-${VER}-macos-${ARCH}.dmg" ;;
            windows) PKG="dist/lofi-${VER}-windows-${ARCH}-setup.exe" ;;
          esac
          echo "Expecting: $PKG"
          ls -lh dist/

          # Byte-level gate: real .deb/.dmg/.exe, not a renamed archive.
          if ! python scripts/verify_packages.py dist/ --expect "$(basename "$PKG")" 2>&1 | tee verify.log; then
            grep -m 10 -E "FAIL|MISSING|not a |placeholder" verify.log | sed 's/^/::error::/' || true
            exit 1
          fi

          # ...and the binary inside still runs.
          BIN="dist/${{ matrix.artifact }}"
          [ -f "$BIN" ] || BIN="dist/lofi"
          chmod +x "$BIN" 2>/dev/null || true
          export LOFI_TOKEN=ci-dummy-token-not-used
          export LOFI_HOME="$RUNNER_TEMP/lofi-home"
          if [ "$OS" = "windows" ]; then
            "$BIN" --version
          else
            "$BIN" --version
            "$BIN" --check || echo "--check reported missing system deps (exit $?)"
          fi

          # Per-OS detail, so the log shows what a user will actually get.
          if [ "$OS" = "linux" ] && command -v dpkg-deb >/dev/null 2>&1; then
            dpkg-deb -I "$PKG"
            dpkg-deb -c "$PKG" | sed -n '1,30p'
          fi
          if [ "$OS" = "macos" ]; then
            hdiutil verify "$PKG"
            hdiutil imageinfo "$PKG" | sed -n '1,20p'
          fi
          if [ "$OS" = "windows" ]; then
            ls -lh "$PKG"
            file "$PKG" 2>/dev/null || true
          fi

      # Log tails as annotations: the one thing that is readable about a failed
      # job without opening the Actions UI.
      - name: Diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          FOUND=0
          for log in build.log pip.log verify.log; do
            [ -f "$log" ] || continue
            FOUND=1
            echo "::group::$log (last 120 lines)"
            tail -n 120 "$log"
            echo "::endgroup::"
            grep -m 5 -E "error|Error|ERROR|Failed|failed|Traceback|No matching|^pip |^python " "$log" \
              | cut -c1-240 | sed 's/^/::error::/'
          done
          if [ "$FOUND" = "0" ]; then
            echo "::error::no build log was written - the job died before the build step"
          fi
          ls -la dist/ 2>/dev/null || true

      - name: Upload artifact (binary + installer)
        uses: actions/upload-artifact@v4
        with:
          name: lofi-${{ matrix.target_os }}-${{ matrix.arch }}
          path: |
            dist/lofi-${{ matrix.target_os }}-${{ matrix.arch }}*
            dist/lofi-${{ steps.version.outputs.ver }}-${{ matrix.target_os }}-${{ matrix.arch }}*
            dist/*.deb
            dist/*.dmg
            dist/*setup.exe
          if-no-files-found: error
          retention-days: 30


  # --------------------------------------------------------------------- #
  # Publish GitHub Release — runs on tag pushes AND on main pushes after bump
  # --------------------------------------------------------------------- #
  release:
    # Run on tags, or on main after a successful prepare+bump, or on workflow_dispatch.
    # needs.build.result must be exactly 'success': 'skipped' only happens when
    # prepare failed after setting its version output (the build `if` then
    # declines), and publishing from that state means a release with zero
    # installers and a verify step that fails with no artifacts to verify.
    if: |
      always() &&
      (startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && needs.prepare.outputs.ver != '' ) || github.event_name == 'workflow_dispatch') &&
      github.actor != 'github-actions[bot]' &&
      needs.build.result == 'success'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version for release
        id: version
        shell: bash
        run: |
          if [ -n "${{ needs.prepare.outputs.ver }}" ]; then
            echo "ver=${{ needs.prepare.outputs.ver }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.version }}" ]; then
            echo "ver=${{ inputs.version }}" | sed 's/^v//' >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "ver=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "ver=$(cat VERSION | tr -d ' \n\r')" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"
          cat VERSION || true

      # Ensure the release tag exists at the bump commit (when triggered by main push)
      - name: Ensure tag exists
        shell: bash
        run: |
          VER="${{ steps.version.outputs.ver }}"
          if git rev-parse "v$VER" >/dev/null 2>&1; then
            echo "Tag v$VER already exists"
          else
            echo "Creating tag v$VER at $(git rev-parse HEAD)"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            # If this run was triggered by a main push, the bump commit was already pushed with its tag by prepare.
            # For workflow_dispatch without prepare, we create the tag now.
            if [ "${{ github.ref }}" = "refs/heads/main" ] && [ -n "${{ needs.prepare.outputs.ver }}" ]; then
              echo "Tag should already exist from prepare; skipping creation"
            else
              git tag "v$VER" || true
              git push origin "v$VER" || true
            fi
          fi
          git ls-remote --tags origin | grep "v$VER" || true

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-dist
          merge-multiple: true

      - name: Verify every installer is real
        shell: bash
        run: |
          set -uo pipefail
          VER="${{ steps.version.outputs.ver }}"
          ls -lh release-dist/
          echo "--- 6-way matrix presence + byte-level format check ---"
          ARGS=()
          MISSING=0
          # All six are required — including windows-arm64, which installs its
          # deps from requirements-winarm.txt. A zip renamed to .deb installs
          # nothing and looks identical to a real one on the release page, so
          # nothing is published unless every installer is present and real.
          REQUIRED="lofi-${VER}-linux-amd64.deb lofi-${VER}-linux-arm64.deb \
                    lofi-${VER}-macos-amd64.dmg lofi-${VER}-macos-arm64.dmg \
                    lofi-${VER}-windows-amd64-setup.exe \
                    lofi-${VER}-windows-arm64-setup.exe"
          for f in $REQUIRED; do
            if [ -f "release-dist/$f" ]; then
              echo "present: $f"
              ARGS+=(--expect "$f")
            else
              echo "MISSING (required) $f"
              MISSING=1
            fi
          done
          if [ "$MISSING" = "1" ]; then
            echo "::error::a required artifact is missing; refusing to publish a partial release"
            ls -l release-dist/
            exit 1
          fi
          python scripts/verify_packages.py release-dist "${ARGS[@]}"

      - name: Generate checksums
        shell: bash
        run: |
          cd release-dist
          sha256sum * > SHA256SUMS.txt || shasum -a 256 * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.ver }}
          target_commitish: ${{ needs.prepare.outputs.sha || github.sha }}
          files: |
            release-dist/*.deb
            release-dist/*.dmg
            release-dist/*setup.exe
            release-dist/lofi-*-linux-amd64
            release-dist/lofi-*-linux-arm64
            release-dist/lofi-*-macos-amd64
            release-dist/lofi-*-macos-arm64
            release-dist/lofi-*-windows-amd64.exe
            release-dist/lofi-*-windows-arm64.exe
            release-dist/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            ## Lofi ${{ steps.version.outputs.ver }} — download and install

            Pick your OS. No Python needed: every package below contains the same
            single-file binary, built on a runner with your CPU.

            | OS | Download | Install |
            |---|---|---|
            | **Windows** (x64) | `lofi-${{ steps.version.outputs.ver }}-windows-amd64-setup.exe` | run it → `C:\Program Files\Lofi\lofi.exe`, on your PATH |
            | **Windows** (ARM64) | `lofi-${{ steps.version.outputs.ver }}-windows-arm64-setup.exe` | run it → `C:\Program Files\Lofi\lofi.exe`, on your PATH |
            | **macOS** (Apple Silicon) | `lofi-${{ steps.version.outputs.ver }}-macos-arm64.dmg` | open, run `Lofi.pkg` → `/usr/local/bin/lofi` |
            | **macOS** (Intel) | `lofi-${{ steps.version.outputs.ver }}-macos-amd64.dmg` | open, run `Lofi.pkg` |
            | **Debian / Ubuntu** (amd64) | `lofi-${{ steps.version.outputs.ver }}-linux-amd64.deb` | `sudo dpkg -i lofi-*.deb && sudo apt-get install -f` |
            | **Debian / Ubuntu** (arm64) | `lofi-${{ steps.version.outputs.ver }}-linux-arm64.deb` | `sudo dpkg -i lofi-*.deb` (Pi, Graviton) |

            Then, in every case:

            ```bash
            lofi --check                 # ffmpeg + libopus + token + data dir
            LOFI_TOKEN=... lofi          # run it
            ```

            System dependencies that are **not** bundled (they are OS packages):

            ```bash
            sudo apt install ffmpeg libopus0     # Debian / Ubuntu
            brew install ffmpeg opus             # macOS
            winget install Gyan.FFmpeg           # Windows
            ```

            ### What each installer does

            - **`.deb`** — binary to `/usr/local/bin/lofi`, a systemd unit (`lofi.service`,
              installed but *not* enabled), a man page, and `/etc/lofi/lofi.env` for your token.
              `sudo systemctl enable --now lofi` once the token is set. Uninstall: `sudo apt remove lofi`.
            - **`.dmg`** — holds a `Lofi.pkg` installer (`pkgbuild`) plus the raw binary in
              `portable/`. Uninstall: `sudo rm /usr/local/bin/lofi; sudo pkgutil --forget io.github.mob5824m-wq.lofi`.
            - **`.exe`** — NSIS installer: Program Files, PATH entry, Start Menu shortcuts and an
              entry under *Apps & features* with a working uninstaller.

            Also published: the raw portable binaries (`lofi-linux-*`, `lofi-macos-*`,
            `lofi-windows-*.exe`) for machines where you would rather not install anything, and
            `SHA256SUMS.txt`:

            ```bash
            sha256sum -c SHA256SUMS.txt --ignore-missing
            ```

            Nothing here contains a bot token — pass `LOFI_TOKEN` at runtime.
            Auto-released on merge to main (`${{ needs.prepare.outputs.old || 'unknown' }}` → `${{ steps.version.outputs.ver }}`);
            full details in `docs/PACKAGING.md`.
